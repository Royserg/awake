<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awake - Keep Your Computer Awake</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .tile-floor {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(auto-fill, 100px);
            grid-template-rows: repeat(auto-fill, 100px);
            z-index: -1;
        }

        .tile {
            background: #e0e0e0;
            position: relative;
            overflow: hidden;
        }

        .tile::after {
            content: '';
            position: absolute;
            background: #333;
        }

        /* Horizontal lines */
        .tile::after {
            width: 100%;
            height: 2px;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            animation: moveLine 5s linear infinite;
        }

        /* Vertical lines */
        .tile:nth-child(odd)::after {
            width: 2px;
            height: 100%;
            right: 0;
            top: 0;
            transform: translateY(-100%);
            animation: moveLine 7s linear infinite;
        }

        @keyframes moveLine {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            padding: 2rem;
            margin: 0 auto;
            text-align: center;
            color: #333;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            background-image: url('./src-tauri/icons/icon.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 2rem;
            color: #666;
        }

        .download-btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            transition: transform 0.2s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="tile-floor" id="tileFloor"></div>
    <div class="container">
        <div class="logo"></div>
        <h1>Awake</h1>
        <p>Keep your computer awake when you need it</p>
        <a href="#" class="download-btn">Download</a>
    </div>
    <script>
        // Create tile grid
        const tileSize = 100;
        const tileFloor = document.getElementById('tileFloor');
        const cols = Math.ceil(window.innerWidth / tileSize);
        const rows = Math.ceil(window.innerHeight / tileSize);
        
        for (let i = 0; i < cols * rows; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tileFloor.appendChild(tile);
        }
    </script>
</body>
</html>
