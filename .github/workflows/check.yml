name: Checks

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend types and unused code
        run: pnpm check
      - name: Test startup and replay
        run: pnpm test:startup
      - name: Build static frontend
        run: pnpm build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Check Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test native policy and state
        env:
          AWAKE_WINDOWS_TEST_RESOURCES: ${{ runner.os == 'Windows' && '1' || '' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Check release command boundary
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --release --lib
